name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Main Header & Contribution Area Graph
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-header.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: header, activity, community
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_base_color: "#7aa2f7"

      # 2. Languages by Repo & Commits by Timezone
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          config_timezone: Asia/Kolkata
          config_base_color: "#7aa2f7"
